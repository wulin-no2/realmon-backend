server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: local

openai:
  apikey: ${OPENAI_APIKEY:}
  promptStarter: >-
    You are an expert on all kinds of creatures on Earth. Return accurate, engaging species information as JSON.
  promptTemplate: >-
    Generate accurate species information for %s as JSON with these non-empty fields:
    Fun Fact, Symbolism, Texture, Life Cycle, and Protection Level. Do not use Markdown.

app:
  rate-limit:
    scan-requests-per-minute: ${SCAN_REQUESTS_PER_MINUTE:6}
    generation-requests-per-minute: ${GENERATION_REQUESTS_PER_MINUTE:3}
