spring:
  datasource:
    url: jdbc:h2:mem:realmontest;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false

jwt:
  secret: test-only-secret-key-that-is-at-least-32-bytes-long
  expiration: 3600000

openai:
  apikey: test-only
  promptStarter: test
  promptTemplate: "%s"
